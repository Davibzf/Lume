name: Build e testes Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg:
    name: FFmpeg LGPL / Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: runtime
        with:
          path: output/runtime
          key: ffmpeg-win64-8.0.1-${{ hashFiles('scripts/build_ffmpeg.sh') }}
      - name: Instalar ferramentas de cross-compilação
        if: steps.runtime.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm make
      - name: Compilar fonte oficial e preservar fontes/licenças
        if: steps.runtime.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-windows-x64
          path: output/runtime/*
          if-no-files-found: error

  windows:
    name: Lume / Windows x64
    needs: ffmpeg
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-windows-x64
          path: output/runtime
      - name: Preparar ambiente e artefatos de terceiros
        shell: pwsh
        run: |
          py -3.11 -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependências de build falharam.' }
          ./prepare.ps1 -FFmpeg output/runtime/ffmpeg.exe
          Copy-Item output/runtime/ffmpeg-8.0.1-source.tar.xz output/
          Copy-Item output/runtime/FFmpeg-build.txt output/
          Copy-Item output/runtime/FFmpeg-LGPL-2.1.txt output/
          Copy-Item output/runtime/ffmpeg.exe output/
      - name: Testar, empacotar e verificar EXE/MSI
        shell: pwsh
        run: ./release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lume-Windows-x64
          path: |
            output/Lume-Setup.exe
            output/Lume-Windows-x64.msi
            output/Lume-Windows-x64.zip
            output/SHA256SUMS.txt
            output/smoke.json
            output/ffmpeg.exe
            output/ffmpeg-8.0.1-source.tar.xz
            output/FFmpeg-build.txt
            output/FFmpeg-LGPL-2.1.txt
          if-no-files-found: error
      - name: Publicar release de uma tag validada
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = (py -3.11 -c 'from version import VERSION; print(VERSION)').Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag e versão do programa são diferentes.' }
          gh release create $env:RELEASE_TAG --verify-tag --title "Lume $version" --notes-file docs/RELEASE_NOTES.md output/Lume-Setup.exe output/Lume-Windows-x64.msi output/Lume-Windows-x64.zip output/SHA256SUMS.txt output/ffmpeg.exe output/ffmpeg-8.0.1-source.tar.xz output/FFmpeg-build.txt output/FFmpeg-LGPL-2.1.txt
          if ($LASTEXITCODE -ne 0) { throw 'Publicação da release falhou.' }
